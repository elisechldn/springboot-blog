spring.application.name=My Blog

spring.datasource.url=jdbc:mysql://localhost:3306/${DATABASE_NAME}?createDatabaseIfNotExist=true
spring.datasource.username= ${DATABASE_USERNAME}
spring.datasource.password= ${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Le secret doit contenir au moins 32 caracteres
security.jwt.secret-key=${JWT_TOKEN}

# 1h in millisecond
security.jwt.expiration-time=3600000

spring.graphql.cors.allowed-origins=${CORS_ALLOWED_ORIGIN}

spring.config.import=file:env.properties
